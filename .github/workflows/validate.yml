name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a breaking Universal Remote Card change shows up without a push.
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      # Pushes the coverage badge to the badges branch.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run check && npm run coverage
      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp coverage/badge.json "$RUNNER_TEMP/coverage.json"
          if git fetch --depth=1 origin badges; then git switch badges; else git switch --orphan badges; fi
          git rm -rq --ignore-unmatch .
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git diff --cached --quiet || { git commit -qm 'Update the coverage badge' && git push origin badges; }
  universal-remote-card:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The latest release users install, and main for changes before they ship.
        urc: [latest, main]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run test:browser
        env:
          URC_REF: ${{ matrix.urc }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-${{ matrix.urc }}
          path: test-results/
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: plugin
